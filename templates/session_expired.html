<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Closed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow-sm rounded-4 text-center p-4" style="max-width: 420px;">
        <div class="text-danger mb-3">
            <i class="fa-solid fa-lock fs-1"></i>
        </div>
        <h4 class="fw-bold text-dark mb-2">Session Closed</h4>
        <p class="text-muted small mb-4">{{ msg }}</p>
        <div class="alert alert-secondary py-2 small mb-0">
            Attendance can only be marked during active class hours.
        </div>
    </div>
</body>
</html>

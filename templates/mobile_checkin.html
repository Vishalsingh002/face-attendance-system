<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mobile Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .camera-card { max-width: 480px; margin: 20px auto; border-radius: 20px; }
        video, canvas { width: 100%; border-radius: 12px; transform: scaleX(-1); }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card camera-card border-0 shadow-lg p-4">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="fa-solid fa-camera-rotate fs-2"></i>
                </div>
                <h4 class="fw-bold mb-0">Daily Class Attendance</h4>
                <p class="text-muted small">Look straight into the front camera to mark attendance</p>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Enter Your Roll Number</label>
                <input type="text" id="rollNumber" class="form-control form-control-lg text-uppercase fw-bold" placeholder="e.g. 24030101" required autofocus>
            </div>

            <div class="position-relative bg-dark rounded-3 overflow-hidden text-center mb-3" style="min-height: 280px;">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" class="d-none"></canvas>
            </div>

            <button type="button" id="btnScan" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-2">
                <i class="fa-solid fa-face-viewfinder me-1"></i> Scan Face & Mark Attendance
            </button>

            <div id="resultBox" class="alert d-none mt-3 text-center py-3 fw-bold"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnScan = document.getElementById('btnScan');
        const rollInput = document.getElementById('rollNumber');
        const resultBox = document.getElementById('resultBox');
        const sessionCode = "{{ session_code }}";

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Please allow camera access on your mobile to mark attendance!");
            }
        }
        startCamera();

        btnScan.addEventListener('click', async () => {
            const roll = rollInput.value.trim();
            if (!roll) {
                alert("Please enter your Roll Number first!");
                rollInput.focus();
                return;
            }

            btnScan.disabled = true;
            btnScan.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Verifying Face...';
            resultBox.className = 'alert d-none';

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageBase64 = canvas.toDataURL('image/jpeg');

            try {
                const res = await fetch('/api/verify-mobile-attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roll_number: roll, session_code: sessionCode, image: imageBase64 })
                });
                const data = await res.json();

                resultBox.classList.remove('d-none');
                if (data.success) {
                    resultBox.className = 'alert alert-success text-center py-3 fw-bold';
                    resultBox.innerHTML = `<i class="fa-solid fa-circle-check fs-4 d-block mb-1"></i>${data.message}`;
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.speak(new SpeechSynthesisUtterance("Attendance Marked!"));
                    }
                } else {
                    resultBox.className = 'alert alert-danger text-center py-3 fw-bold';
                    resultBox.innerHTML = `<i class="fa-solid fa-circle-xmark fs-4 d-block mb-1"></i>${data.message}`;
                }
            } catch (err) {
                resultBox.className = 'alert alert-danger text-center py-3';
                resultBox.innerText = "Network Error! Please try again.";
            } finally {
                btnScan.disabled = false;
                btnScan.innerHTML = '<i class="fa-solid fa-face-viewfinder me-1"></i> Scan Face & Mark Attendance';
            }
        });
    </script>
</body>
</html>
